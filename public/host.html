<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure Race Map | The Storyteller Quiz Night</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/avatars.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: rgba(17, 24, 39, 0.88);
      --gold: #F59E0B;
      --gold-light: #FDE68A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body {
      background: #0B0F19;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Top Brand Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 35px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(245, 158, 11, 0.35);
      z-index: 50;
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(to right, #F59E0B, #FDE68A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-sub {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .header-status-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-pin-pill {
      background: rgba(245, 158, 11, 0.2);
      border: 2px solid #F59E0B;
      color: #FDE68A;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 900;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
    }
    .header-pin-pill .pin-code {
      font-size: 22px;
      font-family: 'Fredoka', sans-serif;
      color: #FFFFFF;
      letter-spacing: 2px;
    }
    .race-clock-pill {
      background: rgba(239, 68, 68, 0.2);
      border: 1.5px solid #EF4444;
      color: #FCA5A5;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: 900;
      font-family: 'Fredoka', sans-serif;
      display: none;
    }
    .btn-finish-early {
      background: linear-gradient(135deg, #EF4444, #B91C1C);
      color: white;
      border: 1.5px solid #FCA5A5;
      border-radius: 20px;
      padding: 7px 18px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.45);
      transition: all 0.2s ease;
    }
    .btn-finish-early:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.7);
    }
    .story-tag {
      background: rgba(245, 158, 11, 0.15);
      border: 1.5px solid #F59E0B;
      color: #FDE68A;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }

    main {
      flex: 1;
      display: flex;
      position: relative;
      height: calc(100vh - 76px);
    }

    /* ============= VIEW 1: LOBBY ============= */
    #screen-lobby {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 25px 40px;
      gap: 20px;
      background: radial-gradient(circle at top center, #1E1B4B 0%, #0F172A 70%, #020617 100%);
      z-index: 40;
    }
    .lobby-top {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 25px;
    }
    .join-card {
      background: var(--card-bg);
      border: 2px solid rgba(245, 158, 11, 0.35);
      border-radius: 24px;
      padding: 24px 30px;
      display: flex;
      align-items: center;
      gap: 26px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .qr-container {
      background: white;
      padding: 10px;
      border-radius: 16px;
      width: 165px;
      height: 165px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    .qr-container img { width: 100%; height: 100%; object-fit: contain; }
    .join-instructions h3 {
      font-size: 15px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .join-url {
      font-size: 28px;
      font-weight: 900;
      color: #38BDF8;
      margin: 4px 0 8px;
    }
    .pin-label {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 700;
      text-transform: uppercase;
    }
    .pin-display {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #F59E0B;
      text-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
      font-family: 'Fredoka', sans-serif;
    }

    .story-select-card {
      background: var(--card-bg);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    select.story-dropdown {
      width: 100%;
      background: #0F172A;
      color: white;
      border: 2px solid #334155;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }
    .btn-start {
      background: linear-gradient(135deg, #10B981, #059669);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px 36px;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.45);
      transition: all 0.2s ease;
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(16, 185, 129, 0.65); }

    .lobby-players-section {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 2px dashed rgba(245, 158, 11, 0.25);
      border-radius: 24px;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
    }
    .players-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .players-count-pill {
      background: rgba(245, 158, 11, 0.2);
      border: 1.5px solid #F59E0B;
      color: #FDE68A;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 900;
      font-family: 'Fredoka', sans-serif;
    }
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
      overflow-y: auto;
      max-height: 270px;
      padding-right: 8px;
    }
    .player-chip {
      background: #1E293B;
      border: 1.5px solid #334155;
      border-radius: 16px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .player-chip .avatar-mini { width: 44px; height: 44px; }
    .player-chip .player-name {
      font-size: 13px;
      font-weight: 800;
      color: white;
      text-align: center;
      width: 100%;
      word-break: break-word;
      white-space: normal;
      line-height: 1.25;
    }

    /* ============= VIEW 2: THE ADVENTURE RACE MAP ============= */
    #screen-map {
      flex: 1;
      position: relative;
      background: radial-gradient(ellipse at center, #1E293B 0%, #0F172A 60%, #020617 100%);
      overflow: hidden;
      display: none;
    }

    /* SVG Desert Trail Background */
    .map-canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Checkpoint Markers on the Map */
    .checkpoint {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
    }
    .checkpoint-icon {
      font-size: 42px;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
      animation: gentleFloat 3s ease-in-out infinite;
    }
    .checkpoint-label {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #FDE68A;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      margin-top: 4px;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .trophy-checkpoint .checkpoint-icon {
      font-size: 64px;
      filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.8));
      animation: pulseTrophy 2s infinite ease-in-out;
    }
    .trophy-checkpoint .checkpoint-label {
      font-size: 15px;
      background: linear-gradient(135deg, #F59E0B, #B45309);
      color: #FFF;
      border: 1.5px solid #FDE68A;
    }

    /* Player Runner Tokens on Map */
    .runner-token {
      position: absolute;
      width: 60px;
      height: 60px;
      transform: translate(-50%, -50%);
      z-index: 20;
      transition: left 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .runner-avatar-box {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
      transition: transform 0.2s ease;
    }
    .runner-token.moving .runner-avatar-box {
      animation: hopRun 0.4s ease infinite;
    }
    .runner-name-tag {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #38BDF8;
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 10px;
      white-space: nowrap;
      margin-top: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .runner-token.leader .runner-name-tag {
      border-color: #F59E0B;
      color: #FDE68A;
      background: rgba(245, 158, 11, 0.25);
    }

    /* Live Race Leaderboard Sidebar - Positioned on Top-Left so the road to Trophy is crystal clear */
    .race-sidebar {
      position: absolute;
      top: 25px;
      left: 30px;
      width: 320px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(245, 158, 11, 0.35);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-title {
      font-size: 15px;
      font-weight: 900;
      color: #FDE68A;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }
    .race-leader-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1E293B;
      border-radius: 12px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,0.05);
      animation: slideIn 0.3s ease;
    }
    .race-leader-item:nth-child(1) { border-color: #F59E0B; background: rgba(245, 158, 11, 0.15); }
    .leader-rank {
      font-size: 15px;
      font-weight: 900;
      color: #FDE68A;
      font-family: 'Fredoka', sans-serif;
      min-width: 28px;
    }
    .leader-avatar { width: 32px; height: 32px; flex-shrink: 0; }
    .leader-info { flex: 1; min-width: 0; }
    .leader-name {
      font-size: 13px;
      font-weight: 800;
      white-space: normal;
      word-break: break-word;
      line-height: 1.25;
    }

    /* Live Join Banner on Map Screen (for late joiners) */
    .map-join-banner {
      position: absolute;
      bottom: 24px;
      right: 28px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(14px);
      border: 2px solid #F59E0B;
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.65);
      z-index: 30;
    }
    .map-qr-mini {
      width: 68px;
      height: 68px;
      background: white;
      padding: 5px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .map-qr-mini img { width: 100%; height: 100%; object-fit: contain; }
    .map-join-info { display: flex; flex-direction: column; gap: 2px; }
    .map-join-label { font-size: 11px; color: #94A3B8; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; }
    .map-join-url { font-size: 13px; color: #38BDF8; font-weight: 800; }
    .map-join-pin {
      font-size: 28px;
      font-weight: 900;
      color: #F59E0B;
      font-family: 'Fredoka', sans-serif;
      letter-spacing: 2px;
      line-height: 1.1;
    }
    .leader-progress-bar {
      width: 100%;
      height: 5px;
      background: #334155;
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden;
    }
    .leader-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #38BDF8, #10B981);
      border-radius: 3px;
      transition: width 0.4s ease;
    }
